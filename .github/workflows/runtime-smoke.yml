name: Android Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.myfootballcareer.game
            adb shell monkey -p com.myfootballcareer.game -c android.intent.category.LAUNCHER 1
            sleep 12
            echo '=== PROCESS ==='
            adb shell pidof com.myfootballcareer.game || true
            echo '=== ACTIVITY ==='
            adb shell dumpsys activity activities | grep -A 8 -B 3 com.myfootballcareer.game || true
            echo '=== CRASH LOGS ==='
            adb logcat -d -v brief AndroidRuntime:E chromium:E WebViewFactory:E ActivityManager:E '*:S' || true
            if ! adb shell pidof com.myfootballcareer.game >/dev/null; then
              echo 'MFC process is not running after launch'
              exit 1
            fi
