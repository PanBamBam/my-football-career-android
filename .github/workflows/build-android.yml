name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk My-Football-Career-1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Football-Career-1.0-Android
          path: My-Football-Career-1.0.apk
          if-no-files-found: error
