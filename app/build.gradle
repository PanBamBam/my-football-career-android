plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myfootballcareer.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myfootballcareer.game'
        minSdk 24
        targetSdk 35
        versionCode 10001
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
